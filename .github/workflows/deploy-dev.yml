name: Deploy to Dev

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: 18

jobs:
  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-StipChaser-Dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity
          echo "AWS Account ID: $(aws sts get-caller-identity --query Account --output text)"

      - name: Install dependencies
        run: npm ci

      - name: Install Lambda function dependencies
        run: |
          cd packages/functions
          npm ci
          cd ../..

      - name: Type check
        run: npm run typecheck

      - name: Deploy to AWS with SST
        id: deploy
        run: |
          npm run deploy:dev
          echo "Deployment completed successfully"

      - name: Get deployment outputs
        run: |
          echo "API URL: $(aws cloudformation describe-stacks --stack-name stipchaser-dev-StipChaserApi --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' --output text || echo 'N/A')"

      - name: Comment PR with deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Successfully deployed to development environment!\n\nThe application is ready for testing.'
            })
