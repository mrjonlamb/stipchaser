name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

env:
  NODE_VERSION: 18

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Lambda function dependencies
        run: |
          cd packages/functions
          npm ci
          cd ../..

      - name: Type check
        run: npm run typecheck

      - name: Type check Lambda functions
        run: |
          cd packages/functions
          npm run typecheck
          cd ../..

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Lambda function dependencies
        run: |
          cd packages/functions
          npm ci
          cd ../..

      - name: Build Next.js application
        run: npm run build

      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "✅ Next.js build successful"
            ls -la .next
          else
            echo "❌ Next.js build failed - .next directory not found"
            exit 1
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: |
          npm audit --production --audit-level=moderate || true

      - name: Run npm audit for Lambda functions
        run: |
          cd packages/functions
          npm audit --production --audit-level=moderate || true
          cd ../..
