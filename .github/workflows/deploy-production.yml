name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: 18

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          role-session-name: GitHubActions-StipChaser-Prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity
          echo "AWS Account ID: $(aws sts get-caller-identity --query Account --output text)"

      - name: Install dependencies
        run: npm ci

      - name: Install Lambda function dependencies
        run: |
          cd packages/functions
          npm ci
          cd ../..

      - name: Type check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Deploy to AWS with SST
        id: deploy
        run: |
          npm run deploy
          echo "Production deployment completed successfully"

      - name: Get deployment outputs
        run: |
          echo "API URL: $(aws cloudformation describe-stacks --stack-name stipchaser-production-StipChaserApi --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' --output text || echo 'N/A')"

      - name: Create deployment summary
        run: |
          echo "# 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deployment failed!"
          echo "Please check the logs and investigate immediately."
